name: CI

on:
  pull_request:
    branches: main

jobs:
  make-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: make build

      - name: Run smoke tests
        run: make test

