name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  make-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: github/sdinc/openclaw-sandbox
        run: make build

      - name: Run smoke tests
        working-directory: github/sdinc/openclaw-sandbox
        run: make test

